[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-sandbox"
version = "0.0.1"
description = "Synchronous Python SDK for tiny-sandbox with resumable execution streams"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Repository = "https://github.com/ruhuang2001/tiny-sandbox"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tiny_sandbox = ["py.typed"]
