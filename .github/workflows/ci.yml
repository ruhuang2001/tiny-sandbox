name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact source revision to validate
        type: string
        default: ''

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: unit and contract tests (race, coverage)
        run: |
          mkdir -p "$RUNNER_TEMP/cov-unit"
          go test -race -covermode=atomic -coverpkg=./... ./... \
            -args -test.gocoverdir="$RUNNER_TEMP/cov-unit"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: ${{ runner.temp }}/cov-unit
          retention-days: 3

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build every command and the example
        run: |
          go build ./...
          go build -o /dev/null ./cmd/sandboxd
          go build -o /dev/null ./cmd/sandboxctl
          go build -o /dev/null ./examples/agent-tool/cmd/demo
      - name: check release configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: check
      - name: release snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --snapshot --clean
      - name: verify checksums and supported platform archives
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          dist = pathlib.Path("dist")
          version = json.loads((dist / "metadata.json").read_text())["version"]
          expected = {
              f"tiny-sandbox_{version}_{system}_{arch}.tar.gz"
              for system in ["linux", "darwin"]
              for arch in ["amd64", "arm64"]
          }
          actual = {p.name for p in dist.glob("*.tar.gz")} | {p.name for p in dist.glob("*.zip")}
          assert actual == expected, (actual, expected)
          checksums = (dist / "checksums.txt").read_text().splitlines()
          assert len(checksums) == len(expected), checksums
          assert {line.split()[1] for line in checksums} == expected, checksums
          PY
          (cd dist && sha256sum -c --quiet checksums.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: release-snapshot
          path: dist/
          retention-days: 3

  e2e:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: end-to-end suite with coverage
        env:
          E2E_COVERAGE: "1"
        run: bash scripts/e2e.sh artifacts/e2e
      - name: merge coverage and enforce the gate
        run: |
          mkdir -p "$RUNNER_TEMP/cov-unit"
          go test -race -covermode=atomic -coverpkg=./... ./... \
            -args -test.gocoverdir="$RUNNER_TEMP/cov-unit"
          bash scripts/coverage.sh "$RUNNER_TEMP/cov-unit" artifacts/e2e/coverage 70
      - name: no containers remain
        run: |
          remaining=$(docker ps -aq --filter 'label=tiny-sandbox.owner' | wc -l | tr -d ' ')
          echo "containers remaining: $remaining"
          test "$remaining" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: artifacts/
          retention-days: 7
